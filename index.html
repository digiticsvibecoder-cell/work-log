<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>سجل الإنجازات</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%232b3238'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23ffd730' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* نفس لغة digitics.org («The Workshop»): ورق رمادي فاتح، حبر متدرّج، خطوط رمادي، أصفر للتأكيد بس، زوايا 2px. */
:root {
  color-scheme: light;
  --bg: #eff0ee; --surface: #ffffff; --ink: #1d2125; --ink-2: #33393e; --ink-3: #565c61;
  --line: #dadddf; --line-2: #b4b9bd; --accent: #ffd730; --on-accent: #1d2125;
  --slate: #2b3238; --on-slate: #e6e9eb; --on-slate-2: #b3bbc1; --on-slate-line: rgb(255 255 255 / .18);
  --mark: #ffe680; --hover: #e6e8e6;
  --ok: #1f7a3d; --ok-bg: #e9f4ec; --wip: #8a5300; --wip-bg: #fbf0d6; --wait: #2c5a8c; --wait-bg: #e7eff8; --note: #50565b; --note-bg: #e6e8e7;
  --h0: #e0e3e1; --h1: #c1c7ca; --h2: #8d959b; --h3: #555c62; --h4: #1d2125;
  --tip-bg: #1d2125; --tip-ink: #f3f4f3; --danger: #b42318;
  --font: 'IBM Plex Sans Arabic', 'IBM Plex Sans', 'Segoe UI', Tahoma, sans-serif;
  --r: 2px; --ease: cubic-bezier(.2, 0, 0, 1); --t: 160ms; --tap: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #15181b; --surface: #1c2024; --ink: #eceeef; --ink-2: #c9cfd3; --ink-3: #9aa3a9; --line: #2d3338; --line-2: #48515a;
    --slate: #0e1113; --on-slate-line: rgb(255 255 255 / .12); --mark: #6b5a12; --hover: #23282d;
    --ok: #7fd39c; --ok-bg: #15301f; --wip: #f0c46e; --wip-bg: #34280e; --wait: #9dc1ec; --wait-bg: #172637; --note: #b8c0c6; --note-bg: #262b30;
    --h0: #252a2f; --h1: #3d464d; --h2: #67727b; --h3: #a6b0b7; --h4: #eef0f1; --tip-bg: #eceeef; --tip-ink: #15181b; --danger: #f08b80;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15181b; --surface: #1c2024; --ink: #eceeef; --ink-2: #c9cfd3; --ink-3: #9aa3a9; --line: #2d3338; --line-2: #48515a;
  --slate: #0e1113; --on-slate-line: rgb(255 255 255 / .12); --mark: #6b5a12; --hover: #23282d;
  --ok: #7fd39c; --ok-bg: #15301f; --wip: #f0c46e; --wip-bg: #34280e; --wait: #9dc1ec; --wait-bg: #172637; --note: #b8c0c6; --note-bg: #262b30;
  --h0: #252a2f; --h1: #3d464d; --h2: #67727b; --h3: #a6b0b7; --h4: #eef0f1; --tip-bg: #eceeef; --tip-ink: #15181b; --danger: #f08b80;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.75 var(--font); letter-spacing: 0; overflow-x: hidden; }
h1, h2, h3, h4 { line-height: 1.3; text-wrap: balance; }
a { color: inherit; text-decoration-color: var(--line-2); text-underline-offset: .25em; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
code { font-family: var(--font); font-size: .9em; background: var(--h0); padding: .05em .35em; border-radius: var(--r); unicode-bidi: isolate; overflow-wrap: anywhere; }
mark { background: var(--mark); color: inherit; border-radius: 1px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap { max-width: 64rem; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2.5rem); }
.muted { color: var(--ink-3); }

/* ---------- masthead ---------- */
.mast { background: var(--slate); color: var(--on-slate); }
.mast .wrap { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding-block: clamp(1.25rem, 3.5vw, 2.25rem) clamp(1.1rem, 3vw, 1.75rem); }
.kicker { margin: 0; color: var(--on-slate-2); font-size: .9375rem; font-weight: 500; }
.mast h1 { margin: .1rem 0 .35rem; font-size: clamp(1.9rem, 1.3rem + 2.4vw, 3rem); font-weight: 700; line-height: 1.2; }
.mast h1::after { content: ""; display: block; inline-size: 3rem; block-size: 4px; margin-block-start: .55rem; background: var(--accent); }
.meta { margin: 0; color: var(--on-slate-2); font-size: .9375rem; }
.meta b { color: var(--on-slate); font-weight: 600; }
.mast-btns { display: flex; gap: .5rem; flex: none; }
.icon-btn { inline-size: var(--tap); block-size: var(--tap); display: inline-grid; place-items: center; border: 1px solid var(--on-slate-line); border-radius: var(--r); background: transparent; color: var(--on-slate); transition: background var(--t) var(--ease); }
.icon-btn:hover { background: rgb(255 255 255 / .08); }
.icon-btn svg { inline-size: 20px; block-size: 20px; }

/* ---------- tabs + toolbar ---------- */
.tabbar { position: sticky; inset-block-start: 0; z-index: 20; background: var(--bg); border-block-end: 1px solid var(--line); }
.tabs { display: flex; gap: .15rem; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; min-block-size: 48px; padding-inline: .85rem; border: 0; border-block-end: 3px solid transparent; background: none; color: var(--ink-3); font-weight: 600; transition: color var(--t) var(--ease), border-color var(--t) var(--ease); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-block-end-color: var(--accent); }
.tab .c { margin-inline-start: .3rem; color: var(--ink-3); font-weight: 500; font-size: .8125rem; }
.toolbar { padding-block: .9rem .25rem; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-block-end: .6rem; }
.field { min-block-size: var(--tap); border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); padding-inline: .75rem; font-size: 1rem; }
.search { position: relative; flex: 1 1 13rem; min-inline-size: 11rem; }
.search .field { inline-size: 100%; padding-inline-end: 2.5rem; }
.search .clear { position: absolute; inset-inline-end: 0; inset-block-start: 0; inline-size: var(--tap); block-size: var(--tap); border: 0; background: none; color: var(--ink-3); display: none; }
.search.has .clear { display: block; }
.dates { display: none; gap: .5rem; align-items: center; }
.dates.on { display: inline-flex; }
.dates .field { inline-size: 10.5rem; }
.result-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1rem; }
.result { margin: 0; color: var(--ink-3); font-size: .9375rem; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.btn { min-block-size: 40px; padding-inline: .9rem; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); font-weight: 600; font-size: .9375rem; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; transition: border-color var(--t) var(--ease), background var(--t) var(--ease); }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { background: #ffe36b; }
.btn svg { inline-size: 18px; block-size: 18px; }
.linkish { border: 0; background: none; padding: 0; color: var(--ink-2); font-size: inherit; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: .25em; text-align: start; }
.linkish:hover { text-decoration-color: currentColor; }
@media (max-width: 620px) {
  .tabs { justify-content: space-between; gap: 0; }
  .tab { padding-inline: .4rem; font-size: .9375rem; }
  .tab .c { display: none; }
  .btn .lg { display: none; } .btn .sm { display: inline; }
  .filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .filters > label > .field { inline-size: 100%; }
  .search, .dates, #proj-wrap { grid-column: 1 / -1; }
  .dates.on { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
  .dates .field { inline-size: 100%; }
  .actions { inline-size: 100%; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
}

/* ---------- shared bits ---------- */
main { padding-block: .5rem 3rem; min-block-size: 50vh; }
.st { display: inline-grid; place-items: center; inline-size: 1.25rem; block-size: 1.25rem; flex: none; }
.st svg { inline-size: 1.15rem; block-size: 1.15rem; }
.st.ok { color: var(--ok); } .st.wip { color: var(--wip); } .st.wait { color: var(--wait); } .st.note { color: var(--note); } .st.none { color: var(--line-2); }
.chip { display: inline-flex; align-items: center; gap: .3rem; padding: .05rem .5rem .1rem; border-radius: var(--r); font-size: .8125rem; font-weight: 600; line-height: 1.6; max-inline-size: 100%; }
.chip svg { inline-size: .95rem; block-size: .95rem; flex: none; }
.chip.ok { color: var(--ok); background: var(--ok-bg); } .chip.wip { color: var(--wip); background: var(--wip-bg); }
.chip.wait { color: var(--wait); background: var(--wait-bg); } .chip.note { color: var(--note); background: var(--note-bg); }
.hash { font-size: .8125rem; font-weight: 500; color: var(--ink-2); text-decoration: none; border-block-end: 1px dotted var(--line-2); font-variant-numeric: tabular-nums; unicode-bidi: isolate; }
.hash:hover { border-block-end-style: solid; border-color: var(--ink-2); }
a.file { text-decoration: none; } a.file code { border-block-end: 1px dotted var(--line-2); }
.chev { inline-size: 18px; block-size: 18px; flex: none; color: var(--ink-3); transition: transform var(--t) var(--ease); }
[aria-expanded="true"] > .chev, details[open] > summary > .chev { transform: rotate(180deg); }
.body { color: var(--ink-2); }
.body p { margin: .25rem 0 .5rem; }
.body ul { margin: 0; padding-inline-start: 1.15rem; list-style: disc; }
.body ul ul { list-style: circle; }
.sm { display: none; }
.body li { margin-block: .3rem; }
.body li::marker { color: var(--line-2); }
.body ul ul { margin-block: .2rem; }
.empty { padding: 2.5rem 0; color: var(--ink-3); }
.empty strong { display: block; color: var(--ink); font-size: 1.125rem; margin-block-end: .35rem; }
details.fold { margin-block: .75rem; }
details.fold > summary { list-style: none; display: inline-flex; align-items: center; gap: .4rem; min-block-size: 36px; color: var(--ink-2); font-weight: 600; font-size: .9375rem; cursor: pointer; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary:hover { color: var(--ink); }
.commit-list { list-style: none; margin: .35rem 0 0; padding: 0; display: grid; gap: .3rem; font-size: .875rem; }
.commit-list li { display: flex; flex-wrap: wrap; gap: .15rem .6rem; align-items: baseline; color: var(--ink-2); }
.commit-list .s { min-inline-size: 0; flex: 1 1 14rem; overflow-wrap: anywhere; }
.commit-list .x { color: var(--ink-3); font-size: .75rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.commit-list .x.branch { color: var(--wip); }
.flash { animation: flash 1.6s var(--ease); }
@keyframes flash { 0%, 30% { background: color-mix(in srgb, var(--accent) 35%, transparent); } 100% { background: transparent; } }

/* ---------- items (day lists) ---------- */
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: .2rem; }
.item-row, .item-btn { display: flex; gap: .6rem; align-items: flex-start; inline-size: 100%; padding: .3rem .4rem; margin-inline: -.4rem; border: 0; border-radius: var(--r); background: none; text-align: start; }
.item-btn { transition: background var(--t) var(--ease); }
.item-btn:hover { background: var(--hover); }
.item-row .st, .item-btn .st { margin-block-start: .3rem; }
.item-t { min-inline-size: 0; flex: 1; overflow-wrap: anywhere; }
.item-btn .chev { margin-block-start: .4rem; }
.item-more { margin: .25rem 0 .75rem; margin-inline-start: 1.85rem; padding: .8rem 1rem; background: var(--surface); border-radius: var(--r); }
.mini-top { display: flex; flex-wrap: wrap; gap: .3rem .7rem; align-items: center; color: var(--ink-3); font-size: .8125rem; margin-block-end: .35rem; }
.mini-title { font-weight: 600; margin: 0 0 .35rem; font-size: 1rem; }

/* ---------- today ---------- */
.day-switch { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .75rem; margin-block: .5rem .25rem; }
.day-title { text-align: center; }
.day-title h2 { margin: 0; font-size: clamp(1.6rem, 1.2rem + 1.5vw, 2.25rem); font-weight: 700; }
.day-title p { margin: 0; color: var(--ink-3); }
.nav-btn { min-block-size: var(--tap); min-inline-size: var(--tap); display: inline-flex; align-items: center; justify-content: center; gap: .25rem; padding-inline: .7rem; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); font-size: .9375rem; font-weight: 500; }
.nav-btn:hover:not([disabled]) { border-color: var(--ink-3); }
.nav-btn[disabled] { opacity: .35; cursor: default; }
.nav-btn svg { inline-size: 18px; block-size: 18px; }
.sum-line { display: flex; flex-wrap: wrap; justify-content: center; gap: .25rem 1.25rem; margin: .5rem 0 1.25rem; color: var(--ink-3); font-size: .9375rem; }
.sum-line b { color: var(--ink); font-size: 1.125rem; font-weight: 600; margin-inline-end: .2rem; font-variant-numeric: tabular-nums; }
.block { margin-block: 1rem 1.5rem; }
.block > h3 { display: flex; align-items: center; gap: .4rem; margin: 0 0 .4rem; font-size: 1rem; font-weight: 600; color: var(--ink-3); }
.now-strip { margin-block-start: 2rem; padding: 1rem 1.1rem; background: var(--surface); border-radius: var(--r); }
.now-strip h3 { margin: 0 0 .4rem; font-size: 1rem; }
.now-strip ul { margin: 0; padding-inline-start: 1.1rem; color: var(--ink-2); }
.now-strip li { margin-block: .2rem; }

/* ---------- entries ---------- */
.proj { margin-block: 1.25rem 2.25rem; }
.proj-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; padding-block-end: .45rem; border-block-end: 2px solid var(--ink); }
.proj-head h2 { margin: 0; font-size: 1.375rem; font-weight: 700; }
.proj-head .n { color: var(--ink-3); font-size: .9375rem; font-variant-numeric: tabular-nums; }
.entry { border-block-end: 1px solid var(--line); scroll-margin-block-start: 4rem; }
.entry-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .15rem .75rem; inline-size: 100%; padding: .8rem .4rem; border: 0; background: none; text-align: start; transition: background var(--t) var(--ease); }
.entry-head:hover { background: var(--hover); }
.entry-head .chev { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
.entry-date { color: var(--ink-3); font-size: .8125rem; font-variant-numeric: tabular-nums; }
.entry-title { font-weight: 600; font-size: 1.0625rem; line-height: 1.5; }
.entry-meta { display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: center; color: var(--ink-3); font-size: .8125rem; margin-block-start: .15rem; }
.entry-body { padding: 0 .4rem 1.1rem; max-inline-size: 52rem; }

/* ---------- wip ---------- */
.wgroup > h2 { display: flex; align-items: baseline; gap: .5rem; margin: 1.5rem 0 .6rem; font-size: 1.125rem; font-weight: 700; }
.wgroup > h2 .n { color: var(--ink-3); font-weight: 500; font-size: .9375rem; }
.wcard { background: var(--surface); border-radius: var(--r); margin-block: .6rem; }
.w-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .25rem .9rem; inline-size: 100%; padding: .95rem 1.1rem; border: 0; border-radius: var(--r); background: none; text-align: start; transition: background var(--t) var(--ease); }
.w-head:hover { background: color-mix(in srgb, var(--hover) 60%, transparent); }
.w-head .chev { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
.w-title { font-weight: 600; font-size: 1.0625rem; line-height: 1.5; }
.w-meta { display: flex; flex-wrap: wrap; gap: .3rem .7rem; align-items: center; color: var(--ink-3); font-size: .8125rem; }
.w-sum { color: var(--ink-2); font-size: .975rem; line-height: 1.65; }
.w-body { padding: 0 1.1rem 1.1rem; }
.wip-sum { color: var(--ink-3); margin: .25rem 0 0; }

/* ---------- stats ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-block: 1rem 2rem; }
.kpi { padding: .5rem 1rem .75rem; border-inline-start: 1px solid var(--line); }
.kpi:nth-child(odd) { border-inline-start: 0; padding-inline-start: 0; }
.kpi:nth-child(n+3) { border-block-start: 1px solid var(--line); padding-block-start: .9rem; }
@media (min-width: 760px) {
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi:nth-child(odd) { border-inline-start: 1px solid var(--line); padding-inline-start: 1.25rem; }
  .kpi:first-child { border-inline-start: 0; padding-inline-start: 0; }
  .kpi:nth-child(n+3) { border-block-start: 0; padding-block-start: .5rem; }
}
.kpi-n { display: block; font-size: clamp(1.9rem, 1.3rem + 1.8vw, 2.6rem); font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi-l { display: block; color: var(--ink-2); font-weight: 500; }
.kpi-s { display: block; color: var(--ink-3); font-size: .875rem; line-height: 1.5; }
.panels { display: grid; gap: 2rem 3rem; }
@media (min-width: 900px) { .panels { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); } }
.panel h2 { margin: 0 0 .2rem; font-size: 1.125rem; font-weight: 600; }
.panel .sub { margin: 0 0 1rem; color: var(--ink-3); font-size: .9375rem; }
.heat { --cell: 22px; display: grid; grid-template-columns: auto auto; justify-content: start; gap: .35rem .6rem; }
.heat-months { grid-column: 2; display: grid; grid-auto-flow: column; grid-auto-columns: var(--cell); gap: 3px; block-size: 1.3rem; font-size: .75rem; color: var(--ink-3); }
.heat-months span { white-space: nowrap; }
.heat-days { grid-row: 2; display: grid; grid-template-rows: repeat(7, var(--cell)); gap: 3px; font-size: .75rem; line-height: var(--cell); color: var(--ink-3); }
.heat-grid { grid-row: 2; display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, var(--cell)); grid-auto-columns: var(--cell); gap: 3px; }
.cell { inline-size: var(--cell); block-size: var(--cell); padding: 0; border: 0; border-radius: 3px; background: var(--h0); }
.cell[data-l="1"] { background: var(--h1); } .cell[data-l="2"] { background: var(--h2); } .cell[data-l="3"] { background: var(--h3); } .cell[data-l="4"] { background: var(--h4); }
.cell.out { visibility: hidden; pointer-events: none; }
.cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
.legend { display: flex; align-items: center; gap: 4px; margin-block-start: .75rem; color: var(--ink-3); font-size: .8125rem; }
.legend i { inline-size: 12px; block-size: 12px; border-radius: 2px; display: inline-block; }
.legend span { margin-inline: .25rem; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: .15rem; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 2.5rem; grid-template-areas: "name n" "track track"; gap: .2rem .75rem; inline-size: 100%; padding: .45rem .5rem; margin-inline: -.5rem; border: 0; border-radius: var(--r); background: none; text-align: start; transition: background var(--t) var(--ease); }
.bar:hover { background: var(--hover); }
.bar-name { grid-area: name; font-weight: 500; }
.bar-n { grid-area: n; text-align: end; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar-track { grid-area: track; block-size: 6px; background: var(--h0); border-radius: 3px; overflow: hidden; }
.bar-fill { block-size: 100%; background: var(--ink-2); border-radius: 3px; }
.bar-ok { color: var(--ink-3); font-size: .8125rem; font-weight: 400; }
.index { inline-size: 100%; border-collapse: collapse; margin-block-start: .5rem; }
.index th, .index td { text-align: start; vertical-align: top; padding: .6rem .75rem; border-block-end: 1px solid var(--line); }
.index th { color: var(--ink-3); font-size: .875rem; font-weight: 600; border-block-end-color: var(--ink); }
.index td:first-child, .index th:first-child { padding-inline-start: 0; }

document.addEventListener('pointerout', (ev) => { if (ev.target.closest && ev.target.closest('.cell')) tip.classList.remove('on'); });
document.addEventListener('focusin', (ev) => { const c = ev.target.closest && ev.target.closest('.cell[data-tip]'); if (c) showTip(c); else tip.classList.remove('on'); });
window.addEventListener('scroll', () => tip.classList.remove('on'), { passive: true });
let rz = 0; window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(sizeHeat); });

/* ================= data: embedded (local file) or remote (GitHub Pages) ================= */
let EMBED = null;
try { EMBED = JSON.parse(document.getElementById('worklog-data').textContent); } catch {}
const REMOTE = EMBED && EMBED.remote ? EMBED.remote : null;
let lastCheck = null, checking = false;
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function deriveKey(pw, enc) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(enc.salt), iterations: enc.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function decryptPkg(enc, key) {
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, key, b64(enc.ct));
  const text = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
}
async function savedKey(enc) {
  try {
    const s = JSON.parse(store.get('key') || 'null');
    if (!s || s.salt !== enc.salt || s.iter !== enc.iter) return null;
    return await crypto.subtle.importKey('raw', b64(s.k), 'AES-GCM', true, ['decrypt']);
  } catch { return null; }
}
let KEY = null, PENDING_PKG = null;
function start(data, version, keepState) {
  const scrollY = window.scrollY;
  M = buildModel(data, version);
  if (!keepState) { if (!readHash()) S.tab = 'today'; }
  renderHeader(); syncInputs(); render();
  if (keepState) window.scrollTo(0, scrollY);
}
async function fetchPkg() {
  const res = await fetch(REMOTE + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function openPkg(pkg, keepState) {
  if (pkg.data) { start(pkg.data, pkg.version, keepState); return true; }
  if (!KEY) KEY = await savedKey(pkg.enc);
  if (KEY) { try { start(await decryptPkg(pkg.enc, KEY), pkg.version, keepState); return true; } catch { KEY = null; } }
  return false;
}
async function check(first) {
  if (checking) return; checking = true;
  try {
    const pkg = await fetchPkg();
    lastCheck = new Date();
    if (!first && M && pkg.version === M.version) { updateMeta(); return; }
    const ok = await openPkg(pkg, !first);
    if (ok) { if (!first) toast('اتحدّث — فيه جديد'); $('#lock').hidden = !pkg.enc; }
    else if (first || !M) showGate(pkg);
  } catch (err) {
    if (first) $('#boot').textContent = 'الصفحة ماحمّلتش — اتأكد من النت وجرّب تاني.';
  } finally { checking = false; }
}
function showGate(pkg) {
  PENDING_PKG = pkg;
  $('#boot').hidden = true; $('#gate').hidden = false; $('#tabbar').hidden = true; $('#toolbar').hidden = true; $('#footer').hidden = true;
  for (const v of $$('.view')) v.hidden = true;
  $('#pw').focus();
}
$('#gate-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const pw = $('#pw').value; if (!pw || !PENDING_PKG) return;
  $('#pw-err').textContent = '';
  try {
    const key = await deriveKey(pw, PENDING_PKG.enc);
    const data = await decryptPkg(PENDING_PKG.enc, key);
    KEY = key;
    if ($('#remember').checked) store.set('key', JSON.stringify({ k: toB64(await crypto.subtle.exportKey('raw', key)), salt: PENDING_PKG.enc.salt, iter: PENDING_PKG.enc.iter }));
    $('#pw').value = '';
    start(data, PENDING_PKG.version, false);
    $('#lock').hidden = false;
  } catch { $('#pw-err').textContent = 'كلمة السر غلط.'; $('#pw').select(); }
});
$('#lock').addEventListener('click', () => { store.del('key'); KEY = null; M = null; location.reload(); });

/* ================= boot ================= */
applyTheme(store.get('theme'));
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!document.documentElement.dataset.theme) applyTheme(null); });
$('#lock').innerHTML = ICON.lock;
if (EMBED && EMBED.sources) start(EMBED, null, false);
else if (REMOTE) {
  check(true);
  const POLL = Math.max(5, +new URLSearchParams(location.search).get('poll') || 60) * 1000;
  setInterval(() => { if (document.visibilityState === 'visible' && M) check(false); }, POLL);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && M) check(false); });
} else $('#boot').innerHTML = 'القالب ده من غير داتا. افتح <code>سجل-الإنجازات.html</code> أو شغّل <code>node build.mjs</code>.';
setInterval(() => {
  const t = toISO(new Date());
  if (M && t !== TODAY) { start(M.DATA, M.version, true); } else updateMeta();
}, 30000);
})();
</script>
